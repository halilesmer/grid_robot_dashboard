name: Automatic Version Bump

on:
  push:
    branches:
      - main
      - master

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Automated Version Bump
        id: version_bump
        uses: phips28/gh-action-bump-version@v11.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          minor-wording: 'feat'
          major-wording: 'BREAKING CHANGE'
          patch-wording: 'fix'
          target-branch: ${{ github.ref_name }}

      - name: Update VERSION File
        run: |
          echo "${{ steps.version_bump.outputs.new_tag }}" > VERSION
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(version): bump version to ${{ steps.version_bump.outputs.new_tag }} [skip ci]" || echo "No changes"
          git push origin ${{ github.ref_name }}